services:
  # ==========================================================
  # 1. API GATEWAY & DESKTOP OVERLAY
  # ==========================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overlay-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/overlay_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODELS_PATH=/models
      - LOG_LEVEL=DEBUG
    volumes:
      - ./storage:/app/storage
      - ./models:/models
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - overlay-net

  # ==========================================================
  # 2. DEDICATED LLM INFERENCE WORKER (llama.cpp CPU & GGUF)
  # ==========================================================
  llm-service:
    build:
      context: .
      dockerfile: services/llm_worker/Dockerfile
    container_name: overlay-llm-worker
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODELS_PATH=/models
      - LOG_LEVEL=DEBUG
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 8G
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - overlay-net

  # ==========================================================
  # 3. DEDICATED SPEECH-TO-TEXT WORKER (whisper.cpp GGML Q8_0)
  # ==========================================================
  stt-service:
    build:
      context: .
      dockerfile: services/voice_worker/Dockerfile
    container_name: overlay-stt-worker
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODELS_PATH=/models
      - LOG_LEVEL=DEBUG
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - overlay-net

  # ==========================================================
  # 4. MESSAGE BROKER (RABBITMQ)
  # ==========================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: overlay-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Web Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - overlay-net

  # ==========================================================
  # 5. DATABASE (POSTGRESQL 16 + PGVECTOR)
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: overlay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=overlay_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d overlay_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - overlay-net

networks:
  overlay-net:
    driver: bridge

volumes:
  rabbitmq-data:
    driver: local
  postgres-data:
    driver: local
