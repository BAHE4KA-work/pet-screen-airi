version: '3.8'

services:
  # ==========================================================
  # 1. API GATEWAY & DESKTOP OVERLAY
  # ==========================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overlay-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/overlay_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODELS_PATH=/models
      - LOG_LEVEL=DEBUG
    volumes:
      - ./storage:/app/storage
      - ./models:/models
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - overlay-net

  # ==========================================================
  # 2. DEDICATED LLM INFERENCE WORKER (Transformers & GGUF)
  # ==========================================================
  llm-service:
    build:
      context: .
      dockerfile: services/llm_worker/Dockerfile
    container_name: overlay-llm-worker
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODELS_PATH=/models
      - LOG_LEVEL=DEBUG
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 12G
    depends_on:
      - rabbitmq
    networks:
      - overlay-net

  # ==========================================================
  # 3. DEDICATED SPEECH-TO-TEXT WORKER (Faster-Whisper & VAD)
  # ==========================================================
  stt-service:
    build:
      context: .
      dockerfile: services/voice_worker/Dockerfile
    container_name: overlay-stt-worker
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODELS_PATH=/models
      - LOG_LEVEL=DEBUG
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          memory: 3G
    depends_on:
      - rabbitmq
    networks:
      - overlay-net

  # ==========================================================
  # 4. MESSAGE BROKER (RABBITMQ)
  # ==========================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: overlay-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Web Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - overlay-net

  # ==========================================================
  # 5. DATABASE (POSTGRESQL 16 + PGVECTOR)
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: overlay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=overlay_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - overlay-net

networks:
  overlay-net:
    driver: bridge

volumes:
  rabbitmq-data:
    driver: local
  postgres-data:
    driver: local
